server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: customer-service
            uri: lb://CUSTOMER-SERVICE
            predicates:
              - Path=/customer/**

          - id: account-service
            uri: lb://ACCOUNT-SERVICE
            predicates:
              - Path=/accounts/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


